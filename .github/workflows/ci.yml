name: CI

# 公開リポジトリ (j3tm0t0/pix68k) 用。GitHub のホストの runner だけを使う (持ち主の機械の runner は使わない)。
# ROM とディスクのイメージは置いていないので、それが要る試験は飛ばされる (終了コード 77)。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  host-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: パッケージを入れる
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev python3
      - name: SingleStepTests を取得
        run: tools/fetch_sst.sh
      - name: Musashi を取得 (差分テスト用)
        run: tools/fetch_musashi.sh
      - name: submodule を取得 (fatfs_names_test が Circle の FatFs を使う)
        run: git submodule update --init --depth 1
      - name: ビルド
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPIX68K_REQUIRE_SDL2=ON -DPIX68K_LIBRETRO=ON -DMUSASHI_DIR="$HOME/.cache/pix68k/musashi"
          cmake --build build
      - name: テスト
        run: cd build && ctest --output-on-failure
      - name: Vita 用の 68000・FPU なしの構成をホストで検証
        run: |
          cmake -S libretro/vita -B build/vita-profile -DPIX68K_PORTABLE_TEST_SHARED=ON
          cmake --build build/vita-profile -j 4
          ctest --test-dir build/vita-profile --output-on-failure
      - name: pico_kbd のホストの試験
        run: tools/pico_kbd/run_host_tests.sh build/pico_kbd_host

  host-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: パッケージを入れる
        run: brew install sdl2
      - name: SingleStepTests を取得
        run: tools/fetch_sst.sh
      - name: Musashi を取得 (差分テスト用)
        run: tools/fetch_musashi.sh
      - name: submodule を取得 (fatfs_names_test が Circle の FatFs を使う)
        run: git submodule update --init --depth 1
      - name: ビルド
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPIX68K_REQUIRE_SDL2=ON -DPIX68K_LIBRETRO=ON -DMUSASHI_DIR="$HOME/.cache/pix68k/musashi"
          cmake --build build -j
      - name: テスト
        run: cd build && ctest --output-on-failure
      - name: Vita 用の 68000・FPU なしの構成をホストで検証
        run: |
          cmake -S libretro/vita -B build/vita-profile -DPIX68K_PORTABLE_TEST_SHARED=ON
          cmake --build build/vita-profile -j 4
          ctest --test-dir build/vita-profile --output-on-failure

  pix68kcli:
    # HTTP の口を操作するコマンド (tools/pix68kcli、Go)。Go の版は release.yml の GO_VERSION と同じにする
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/pix68kcli
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: go vet
        run: go version && go vet ./...
      - name: go test
        run: go test -count=1 ./...
      - name: クロスビルド (macOS、Linux、Windows の 7 つ)
        run: PIX68KCLI_VERSION="${GITHUB_SHA:0:7}" ./build.sh && test "$(ls dist | wc -l)" = 7

  baremetal:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PREFIX64: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: パッケージを入れる
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-system-arm mtools python3
      - name: submodule (Circle) を取得
        run: git submodule update --init --depth 1
      - name: ビルド (QEMU 用 Pi 3)
        run: tools/build_baremetal.sh 3 --qemu
      - name: QEMU raspi3b で起動を確認 (ROM は使わない)
        run: tools/qemu_smoke.sh
      - name: ビルド (Pi 3、68000 だけ)
        run: PIX68K_CPU020=0 tools/build_baremetal.sh 3
      - name: ビルド (Pi 3)
        run: tools/build_baremetal.sh 3
      - name: ビルド (Pi 4、Pi 400)
        run: tools/build_baremetal.sh 4
      - name: ビルド (Pi 5)
        run: tools/build_baremetal.sh 5
